name: poll-scylla-acceptance
on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/infrastructure/src/scylla/polls/**'
      - 'crates/infrastructure/tests/poll_persistence.rs'
      - '.github/workflows/poll-scylla-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    # Fork code must not run on the persistent self-hosted machine.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: vm-runner
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99"
      - name: Verify Linux, Docker and Scylla CPU support
        run: |
          test "$(uname -s)" = Linux
          docker info >/dev/null
          grep -qw sse4_2 /proc/cpuinfo
          grep -qw pclmulqdq /proc/cpuinfo
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/poll-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Serial read retry regression
        run: cargo test --locked -p discordy-messages-infrastructure --lib retry_tests
      - name: Real Scylla poll concurrency and lifecycle
        run: cargo test --locked -p discordy-messages-infrastructure --test poll_persistence -- --nocapture
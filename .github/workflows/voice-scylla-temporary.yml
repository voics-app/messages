name: Temporary voice Scylla integration
on:
  push:
    branches: [feature/voice-messages-15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scylla:
    runs-on: vm-runner
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ runner.temp }}/voice-cargo-${{ github.run_id }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/voice-target-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Test real Scylla attachment roundtrip
        shell: bash
        run: |
          set -o pipefail
          cargo test -p discordy-messages-infrastructure --test scylla_repositories -- --nocapture 2>&1 | tee "$RUNNER_TEMP/voice-scylla.log"
          if grep -q 'skipping: ScyllaDB' "$RUNNER_TEMP/voice-scylla.log"; then exit 1; fi

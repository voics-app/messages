name: Scheduled event notifier draft QA
on:
  push:
    branches: [feature/notifier-scheduled-events]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  notifier-events:
    runs-on: vm-runner
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Event notifier unit and pipeline tests
        run: cargo test -p discordy-messages-notifier --lib --test pipeline

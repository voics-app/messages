name: ci
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guild-activity-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/api-53-message-activity'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p discordy-messages-infrastructure --test scylla_repositories --test scheduled_dispatch -- --test-threads=1

  announcement-scylla-integration:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise publication marker against temporary Scylla
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_TARGET_DIR: ${{ runner.temp }}/announcement-scylla-${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRE_SCYLLA_CPU: "1"
        run: cargo test --locked -p discordy-messages-infrastructure --test scylla_repositories -- --nocapture

  gitflow:
    if: github.event_name == 'pull_request'
    uses: voics-app/.github/.github/workflows/gitflow-guard.yml@main

  brand:
    # Rebrand check (docs#69): no hard-coded product name or domain in user-visible strings.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-brand.sh
      - run: python3 scripts/check-snowflake.py
      - run: python3 scripts/check-scheduled-contracts.py

  rust:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: voics-app/.github/.github/workflows/rust.yml@main
    with:
      image-name: messages
      description: Voics messages service
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; messages never performs RSA decryption.
      audit-args: --ignore RUSTSEC-2023-0071
    secrets:
      private-deps-token: ${{ secrets.DEPS_TOKEN }}

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: voics-app/.github/.github/workflows/docker.yml@main
    with:
      image-name: messages
      description: Voics messages service

  docker-notifier:
    # The notifier is a second binary of this workspace with its own image (docs plans/2026-11-03-mobile-app.md).
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: voics-app/.github/.github/workflows/docker.yml@main
    with:
      image-name: messages-notifier
      dockerfile: Dockerfile.notifier
      description: Voics notifier (push notifications)

name: ci
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  rust:
    uses: discordy-voics/.github/.github/workflows/rust.yml@feature/59-ci-cache
    with:
      runs-on: vm-ci2
      image-name: messages
      description: Discordy messages service
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; messages never performs RSA decryption.
      audit-args: --ignore RUSTSEC-2023-0071
    secrets:
      private-deps-token: ${{ secrets.DEPS_TOKEN }}

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@feature/59-ci-cache
    with:
      runs-on: vm-ci2
      push: false
      image-name: messages
      description: Discordy messages service

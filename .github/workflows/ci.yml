name: ci
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  brand:
    # Rebrand check (docs#69): no hard-coded product name or domain in user-visible strings.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-brand.sh
      - run: python3 scripts/check-snowflake.py
      - run: python3 scripts/check-scheduled-contracts.py

  rust:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      image-name: messages
      description: Voics messages service
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; messages never performs RSA decryption.
      audit-args: --ignore RUSTSEC-2023-0071
    secrets:
      private-deps-token: ${{ secrets.DEPS_TOKEN }}

  sticker-scylla-integration:
    if: github.event_name == 'pull_request'
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require Scylla CPU features
        run: grep -qw sse4_2 /proc/cpuinfo && grep -qw pclmulqdq /proc/cpuinfo
      - name: Exercise sticker persistence in Scylla
        shell: bash
        run: |
          cargo test --locked -p discordy-messages-infrastructure --test scylla_repositories scylla_adapters_against_a_real_node -- --nocapture &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            for id in $(docker ps -aq --filter name=messages-it-scylla-); do
              echo "Scylla startup diagnostics for $id"
              docker logs --tail 30 "$id" 2>&1 || true
            done
            sleep 20
          done
          wait "$test_pid"

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: messages
      description: Voics messages service

  docker-notifier:
    # The notifier is a second binary of this workspace with its own image (docs plans/2026-11-03-mobile-app.md).
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: messages-notifier
      dockerfile: Dockerfile.notifier
      description: Voics notifier (push notifications)

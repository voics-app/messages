[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/contracts", "crates/infrastructure", "crates/interface", "bin/messages"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
discordy-messages-domain = { path = "crates/domain" }
discordy-messages-application = { path = "crates/application" }
discordy-messages-infrastructure = { path = "crates/infrastructure" }
discordy-messages-interface = { path = "crates/interface" }
discordy-messages-contracts = { path = "crates/contracts" }

async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
futures = "0.3"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

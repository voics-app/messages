[package]
name = "discordy-messages-notifier"
description = "Voics notifier: decides who gets a push for a new message and sends it through APNs and FCM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "notifier"

[dependencies]
discordy-messages-contracts.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
rskafka = { version = "0.6", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls-webpki-roots"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum = "0.8"
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }

[lints]
workspace = true
